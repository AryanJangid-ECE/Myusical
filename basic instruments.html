<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Harmonium UI</title>
    <style>
        /* Base Dark Theme & Typography */
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }

        h2 {
            font-weight: 400;
            letter-spacing: 2px;
            color: #888;
            margin-bottom: 40px;
        }

        /* The Harmonium Body */
        .harmonium-board {
            display: flex;
            background: linear-gradient(145deg, #1e1e1e, #2a2a2a);
            padding: 30px 20px;
            border-radius: 12px;
            box-shadow: 
                0 20px 50px rgba(0,0,0,0.8), 
                inset 0 2px 1px rgba(255,255,255,0.1),
                inset 0 -5px 15px rgba(0,0,0,0.5);
            border: 1px solid #333;
        }

        /* Key Layout Logic */
        .key-group {
            position: relative;
            display: flex;
        }

        /* General Key Styling */
        .key {
            cursor: pointer;
            user-select: none;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            padding-bottom: 15px;
            font-size: 0.8rem;
            font-weight: 600;
            transition: all 0.1s ease;
        }

        /* White Keys (Sleek Metallic Finish) */
        .key.white {
            width: 65px;
            height: 240px;
            background: linear-gradient(to bottom, #f5f5f7 0%, #e1e1e1 100%);
            border: 1px solid #a0a0a0;
            border-radius: 0 0 6px 6px;
            box-shadow: 
                inset 0 1px 0 #fff, 
                0 6px 6px rgba(0,0,0,0.3);
            margin: 0 2px;
            color: #444;
            z-index: 1;
        }

        .key.white:active, .key.white.active {
            transform: translateY(4px);
            box-shadow: 0 2px 2px rgba(0,0,0,0.3);
            background: linear-gradient(to bottom, #e5e5e7 0%, #d1d1d1 100%);
        }

        /* Black Keys (Matte Dark Finish) */
        .key.black {
            width: 40px;
            height: 150px;
            background: linear-gradient(145deg, #2c2c2c, #000000);
            position: absolute;
            right: -22px; /* Centers it perfectly between white keys */
            top: 0;
            z-index: 10;
            border-radius: 0 0 5px 5px;
            box-shadow: 
                inset 0 1px 1px rgba(255,255,255,0.2), 
                0 5px 8px rgba(0,0,0,0.7);
            border: 1px solid #000;
            color: #888;
            padding-bottom: 10px;
        }

        .key.black:active, .key.black.active {
            transform: translateY(4px);
            box-shadow: 0 2px 3px rgba(0,0,0,0.7);
            background: #0a0a0a;
        }
    </style>
</head>
<body>

    <h2>HARMONIUM INTERFACE</h2>

    <div class="harmonium-board">
        <div class="key-group">
            <div class="key white" data-note="Sa">Sa</div>
            <div class="key black" data-note="Re(k)"></div>
        </div>
        <div class="key-group">
            <div class="key white" data-note="Re">Re</div>
            <div class="key black" data-note="Ga(k)"></div>
        </div>
        <div class="key-group">
            <div class="key white" data-note="Ga">Ga</div>
        </div>
        <div class="key-group">
            <div class="key white" data-note="Ma">Ma</div>
            <div class="key black" data-note="Ma(t)"></div>
        </div>
        <div class="key-group">
            <div class="key white" data-note="Pa">Pa</div>
            <div class="key black" data-note="Dha(k)"></div>
        </div>
        <div class="key-group">
            <div class="key white" data-note="Dha">Dha</div>
            <div class="key black" data-note="Ni(k)"></div>
        </div>
        <div class="key-group">
            <div class="key white" data-note="Ni">Ni</div>
        </div>
        <div class="key-group">
            <div class="key white" data-note="Sa^">Sa^</div>
        </div>
    </div>

    <script>
        // UX Interaction: Add visual feedback and log the note when clicked
        const keys = document.querySelectorAll('.key');

        keys.forEach(key => {
            // Mouse events
            key.addEventListener('mousedown', () => pressKey(key));
            key.addEventListener('mouseup', () => releaseKey(key));
            key.addEventListener('mouseleave', () => releaseKey(key));

            // Touch events for mobile UX
            key.addEventListener('touchstart', (e) => {
                e.preventDefault(); // Prevents default scrolling behavior
                pressKey(key);
            });
            key.addEventListener('touchend', (e) => {
                e.preventDefault();
                releaseKey(key);
            });
        });

        function pressKey(keyElement) {
            keyElement.classList.add('active');
            const note = keyElement.getAttribute('data-note');
            console.log(`Note played: ${note}`);
        }

        function releaseKey(keyElement) {
            keyElement.classList.remove('active');
        }
    </script>

</body>
</html>
